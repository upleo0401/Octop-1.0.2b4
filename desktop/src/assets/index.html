<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AimiOct</title>
    <script>
      document.documentElement.dataset.chrome = /Mac|iPhone|iPad/.test(
        navigator.userAgent,
      )
        ? "mac"
        : "windows";
      document.documentElement.style.setProperty(
        "--window-controls-inset-end",
        document.documentElement.dataset.chrome === "mac" ? "80px" : "138px",
      );
      if (new URLSearchParams(location.search).get("settings") === "1") {
        document.documentElement.dataset.mode = "settings";
        document.documentElement.style.setProperty(
          "--window-controls-inset-end",
          "36px",
        );
      }
    </script>
    <script type="module" src="/wails/runtime.js"></script>
    <style>
      :root {
        color-scheme: light;
        --bg-primary: #ffffff;
        --bg-layout: #f5f6f8;
        --bg-secondary: #f7f8fa;
        --text-primary: #111827;
        --text-secondary: #4b5563;
        --text-tertiary: #9ca3af;
        --border: #e5e7eb;
        --brand: #e85d75;
        --brand-hover: #d14a62;
        --brand-soft: #fde8ec;
        --on-brand: #ffffff;
        --shadow: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.03);
        --radius: 12px;
        --window-controls-inset-end: 80px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter",
          "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
        margin: 0;
        background: var(--bg-layout);
        color: var(--text-primary);
        -webkit-font-smoothing: antialiased;
      }
      .window-chrome {
        position: fixed;
        inset: 0 0 auto 0;
        z-index: 20;
        height: 32px;
        --wails-draggable: drag;
      }
      .window-controls {
        position: fixed;
        top: 0;
        right: 0;
        z-index: 30;
        display: none;
        align-items: center;
        height: 32px;
        user-select: none;
        -webkit-app-region: no-drag;
      }
      html[data-chrome="mac"] .ctrl-mac,
      html[data-chrome="windows"] .ctrl-win {
        display: flex;
      }
      html[data-mode="settings"],
      html[data-mode="settings"] body {
        overflow: hidden;
        height: 100%;
        background: var(--bg-primary);
        --window-controls-inset-end: 36px;
      }
      html[data-mode="settings"] .window-controls [data-action="minimise"],
      html[data-mode="settings"] .window-controls [data-action="toggle-maximise"] {
        display: none;
      }
      html[data-mode="settings"] .wrap {
        max-width: none;
        height: 100%;
        min-height: 0;
        display: flex;
        flex-direction: column;
        padding: 44px 20px 28px;
      }
      html[data-mode="settings"] .card {
        flex: 1 1 auto;
        min-height: 0;
        overflow-x: hidden;
        overflow-y: auto;
      }
      html[data-mode="settings"] .row > div:first-child {
        flex: 1;
        min-width: 0;
      }
      html[data-mode="settings"] .row small {
        overflow-wrap: anywhere;
      }
      html[data-mode="settings"] input.url {
        min-width: 0;
      }
      html[data-mode="settings"] #title {
        padding-right: var(--window-controls-inset-end);
        flex-shrink: 0;
      }
      html[data-mode="settings"] .subtitle {
        margin-bottom: 16px;
        flex-shrink: 0;
      }
      html[data-mode="settings"] .actions {
        margin-top: 14px;
        flex-shrink: 0;
      }
      html[data-mode="settings"] #settings-status {
        flex-shrink: 0;
      }
      .ctrl-mac {
        gap: 8px;
        padding: 0 12px 0 8px;
      }
      .light {
        width: 12px;
        height: 12px;
        padding: 0;
        border: 0.5px solid transparent;
        border-radius: 50%;
        cursor: pointer;
        appearance: none;
        flex-shrink: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        line-height: 0;
      }
      .light:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 2px;
      }
      .glyph {
        opacity: 0;
        display: block;
        font-size: 9px;
        font-weight: 700;
        line-height: 1;
        color: inherit;
        pointer-events: none;
        transform: translateY(-0.5px);
      }
      .ctrl-mac:hover .glyph {
        opacity: 0.85;
      }
      .zoom {
        background: #28c840;
        border-color: #12a12a;
        color: #003a08;
      }
      .min {
        background: #febc2e;
        border-color: #d89e19;
        color: #5c3b00;
      }
      .close {
        background: #ff5f57;
        border-color: #e0443e;
        color: #4d0000;
      }
      .win-btn {
        width: 46px;
        height: 32px;
        padding: 0;
        border: none;
        background: transparent;
        color: var(--text-secondary);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
      }
      .win-btn:hover {
        background: rgba(0, 0, 0, 0.06);
        color: var(--text-primary);
      }
      .win-btn:focus-visible {
        outline: 2px solid #1677ff;
        outline-offset: -2px;
      }
      .win-close:hover {
        background: #e81123;
        color: #fff;
      }
      .wrap {
        max-width: 420px;
        margin: 0 auto;
        padding: 56px max(24px, var(--window-controls-inset-end)) 24px 24px;
      }
      h1 {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.02em;
        margin: 0 0 6px;
      }
      .subtitle {
        margin: 0 0 20px;
        font-size: 13px;
        color: var(--text-tertiary);
      }
      .card {
        background: var(--bg-primary);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        overflow: hidden;
      }
      .row {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: center;
        padding: 14px 16px;
      }
      .row + .row {
        border-top: 1px solid var(--border);
      }
      .row .label {
        font-size: 14px;
        font-weight: 500;
      }
      .row small {
        display: block;
        font-size: 12px;
        line-height: 1.45;
        color: var(--text-tertiary);
        margin-top: 4px;
      }
      select {
        font: inherit;
        font-size: 13px;
        color: var(--text-primary);
        background: var(--bg-secondary);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 6px 10px;
        min-width: 108px;
        outline: none;
      }
      select:focus {
        border-color: var(--brand);
        box-shadow: 0 0 0 3px rgba(232, 93, 117, 0.12);
      }
      .row.stack {
        flex-direction: column;
        align-items: stretch;
      }
      input.url {
        font: inherit;
        font-size: 13px;
        color: var(--text-primary);
        background: var(--bg-secondary);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 10px;
        width: 100%;
        outline: none;
      }
      input.url:focus {
        border-color: var(--brand);
        box-shadow: 0 0 0 3px rgba(232, 93, 117, 0.12);
      }
      input.url:disabled {
        color: var(--text-tertiary);
        cursor: not-allowed;
      }
      .switch {
        position: relative;
        width: 40px;
        height: 24px;
        flex-shrink: 0;
      }
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .switch span {
        position: absolute;
        inset: 0;
        background: #e5e7eb;
        border-radius: 999px;
        cursor: pointer;
        transition: background 0.18s ease;
      }
      .switch span::after {
        content: "";
        position: absolute;
        top: 2px;
        left: 2px;
        width: 20px;
        height: 20px;
        background: #fff;
        border-radius: 50%;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
        transition: transform 0.18s ease;
      }
      .switch input:checked + span {
        background: var(--brand);
      }
      .switch input:checked + span::after {
        transform: translateX(16px);
      }
      .actions {
        display: flex;
        gap: 10px;
        margin-top: 18px;
      }
      .actions button {
        flex: 1;
        padding: 9px 12px;
        border-radius: 8px;
        cursor: pointer;
        font: inherit;
        font-size: 14px;
        font-weight: 500;
      }
      .actions .primary {
        background: var(--brand);
        color: var(--on-brand);
        border: 0;
      }
      .actions .primary:hover {
        background: var(--brand-hover);
      }
      .actions .ghost {
        background: var(--bg-primary);
        color: var(--text-secondary);
        border: 1px solid var(--border);
      }
      .actions .ghost:hover {
        background: var(--bg-secondary);
      }
      .status {
        min-height: 1.4em;
        margin: 12px 0 0;
        font-size: 13px;
        color: #b91c1c;
      }
      .loading {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg-layout);
        padding: 56px 24px 40px;
        box-sizing: border-box;
      }
      .loading-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        width: min(100%, 420px);
        padding: 36px 32px 32px;
        background: var(--bg-primary);
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
        text-align: center;
      }
      .loading img {
        width: 120px;
        aspect-ratio: 1;
        height: auto;
        object-fit: contain;
        background: transparent;
        cursor: pointer;
        user-select: none;
        transition: transform 0.18s ease;
      }
      .loading img:hover {
        transform: scale(1.04) translateY(-2px);
      }
      .loading img:active {
        transform: scale(0.94);
      }
      .loading-brand {
        margin: 0;
        font-size: 17px;
        font-weight: 600;
        line-height: 1.4;
        letter-spacing: -0.02em;
        color: var(--text-primary);
      }
      .loading-hint {
        margin: 0;
        font-size: 13px;
        line-height: 1.6;
        color: var(--text-tertiary);
      }
      .loading.is-error .loading-hint {
        display: none;
      }
      .loading-footer {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        width: 100%;
        margin-top: 4px;
      }
      .loading-bar {
        width: 100%;
        height: 4px;
        overflow: hidden;
        border-radius: 999px;
        background: var(--brand-soft);
      }
      .loading-bar-fill {
        display: block;
        width: 36%;
        height: 100%;
        border-radius: 999px;
        background: var(--brand);
        animation: loading-slide 1.2s ease-in-out infinite;
      }
      .loading-status {
        margin: 0;
        width: 100%;
        color: var(--text-secondary);
        font-size: 13px;
        line-height: 1.55;
      }
      .loading.is-error .loading-bar {
        display: none;
      }
      .loading.is-error .loading-status {
        color: #991b1b;
      }
      .loading-open-browser {
        appearance: none;
        border: 1px solid var(--border);
        background: var(--bg-primary);
        color: var(--text-primary);
        border-radius: 8px;
        padding: 8px 14px;
        font-size: 13px;
        cursor: pointer;
      }
      .loading-open-browser.hidden {
        display: none;
      }
      @keyframes loading-slide {
        0% {
          transform: translateX(-120%);
        }
        100% {
          transform: translateX(320%);
        }
      }
      .hidden {
        display: none !important;
      }
      #dashboard-frame {
        position: fixed;
        top: 32px;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: calc(100% - 32px);
        border: 0;
        background: #fff;
        z-index: 5;
      }
      html[data-mode="settings"] #dashboard-frame {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="window-chrome octop-desktop-drag" id="window-chrome"></div>
    <div
      class="window-controls ctrl-mac"
      data-chrome="mac"
      data-octop-no-drag="true"
      aria-label="窗口控制"
    >
      <button
        type="button"
        class="light zoom"
        data-action="toggle-maximise"
        aria-label="最大化"
      >
        <span class="glyph" aria-hidden>+</span>
      </button>
      <button
        type="button"
        class="light min"
        data-action="minimise"
        aria-label="最小化"
      >
        <span class="glyph" aria-hidden>–</span>
      </button>
      <button
        type="button"
        class="light close"
        data-action="close"
        aria-label="关闭"
      >
        <span class="glyph" aria-hidden>×</span>
      </button>
    </div>
    <div
      class="window-controls ctrl-win"
      data-chrome="windows"
      data-octop-no-drag="true"
      aria-label="Window controls"
    >
      <button type="button" class="win-btn" data-action="minimise" aria-label="Minimize">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M5 12h14" />
        </svg>
      </button>
      <button
        type="button"
        class="win-btn"
        data-action="toggle-maximise"
        aria-label="Maximize"
      >
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="2" />
        </svg>
      </button>
      <button
        type="button"
        class="win-btn win-close"
        data-action="close"
        aria-label="Close"
      >
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M18 6 6 18" />
          <path d="m6 6 12 12" />
        </svg>
      </button>
    </div>

    <div class="loading" id="loading-panel">
      <div class="loading-card">
        <img
          id="mascot"
          src="/brand-mark.png"
          alt="AimiOct"
          draggable="false"
        />
        <p class="loading-brand" id="loading-brand">AimiOct</p>
        <p class="loading-hint" id="loading-hint">
          正在检查运行环境，可能需要几分钟。
        </p>
        <div class="loading-footer">
          <div class="loading-bar" role="progressbar" aria-hidden="true">
            <span class="loading-bar-fill"></span>
          </div>
          <p class="loading-status" id="status">正在启动，请稍候…</p>
          <button type="button" class="loading-open-browser hidden" id="open-browser">
            用浏览器打开
          </button>
        </div>
      </div>
    </div>

    <iframe
      id="dashboard-frame"
      class="hidden"
      title="AimiOct"
      allow="clipboard-read; clipboard-write; microphone; camera"
    ></iframe>

    <div id="settings-panel" class="hidden">
      <div class="wrap">
        <h1 id="title">AimiOct 设置</h1>
        <p class="subtitle" id="subtitle">桌面端偏好</p>
        <div class="card">
          <div class="row">
            <div>
              <div class="label" id="l-lang">语言 / Language</div>
              <small id="h-lang">界面显示语言</small>
            </div>
            <select id="locale">
              <option value="zh">中文</option>
              <option value="en">English</option>
            </select>
          </div>
          <div class="row">
            <div>
              <div class="label" id="l-auto">开机启动</div>
              <small id="h-auto">登录系统后自动启动</small>
            </div>
            <label class="switch">
              <input type="checkbox" id="autostart" />
              <span></span>
            </label>
          </div>
          <div class="row">
            <div>
              <div class="label" id="l-tray">最小化到托盘</div>
              <small id="h-tray">最小化时隐藏到托盘</small>
            </div>
            <label class="switch">
              <input type="checkbox" id="tray" />
              <span></span>
            </label>
          </div>
          <div class="row">
            <div>
              <div class="label" id="l-sleep">防止系统休眠</div>
              <small id="h-sleep">运行时阻止自动休眠</small>
            </div>
            <label class="switch">
              <input type="checkbox" id="sleep" />
              <span></span>
            </label>
          </div>
        </div>
        <div class="actions">
          <button class="primary" id="show-main">显示 AimiOct</button>
          <button class="ghost" id="quit">退出</button>
        </div>
        <p class="status hidden" id="settings-status"></p>
      </div>
    </div>
    <script type="module">
      import { Call, Events } from "/wails/runtime.js";

      const copy = {
        zh: {
          statusWait: "正在启动，请稍候…",
          loadingHint: "正在启动本机服务…",
          title: "AimiOct 设置",
          subtitle: "桌面端偏好",
          lang: "语言",
          langH: "界面显示语言",
          auto: "开机启动",
          autoH: "登录系统后自动启动",
          tray: "最小化到托盘",
          trayH: "最小化时隐藏到托盘",
          sleep: "防止系统休眠",
          sleepH: "运行时阻止自动休眠",
          showMain: "显示 AimiOct",
          quit: "退出",
          openBrowser: "用浏览器打开",
          winGroup: "窗口控制",
          winMin: "最小化",
          winMax: "最大化",
          winClose: "关闭",
        },
        en: {
          statusWait: "Starting, please wait…",
          loadingHint: "Starting the local service…",
          title: "AimiOct Settings",
          subtitle: "Desktop preferences",
          lang: "Language",
          langH: "Display language",
          auto: "Launch at login",
          autoH: "Start after you sign in",
          tray: "Minimize to tray",
          trayH: "Hide to the tray on minimize",
          sleep: "Prevent system sleep",
          sleepH: "Stay awake while AimiOct is running",
          showMain: "Show AimiOct",
          quit: "Quit",
          openBrowser: "Open in browser",
          winGroup: "Window controls",
          winMin: "Minimize",
          winMax: "Maximize",
          winClose: "Close",
        },
      };

      function applyWindowCopy(t) {
        for (const group of document.querySelectorAll(".window-controls")) {
          group.setAttribute("aria-label", t.winGroup);
        }
        for (const btn of document.querySelectorAll("[data-action]")) {
          const action = btn.getAttribute("data-action");
          if (action === "minimise") btn.setAttribute("aria-label", t.winMin);
          if (action === "toggle-maximise")
            btn.setAttribute("aria-label", t.winMax);
          if (action === "close") btn.setAttribute("aria-label", t.winClose);
        }
      }

      function applyCopy(locale) {
        const t = copy[locale] || copy.en;
        document.getElementById("title").textContent = t.title;
        document.getElementById("subtitle").textContent = t.subtitle;
        document.getElementById("l-lang").textContent = t.lang;
        document.getElementById("h-lang").textContent = t.langH;
        document.getElementById("l-auto").textContent = t.auto;
        document.getElementById("h-auto").textContent = t.autoH;
        document.getElementById("l-tray").textContent = t.tray;
        document.getElementById("h-tray").textContent = t.trayH;
        document.getElementById("l-sleep").textContent = t.sleep;
        document.getElementById("h-sleep").textContent = t.sleepH;
        document.getElementById("show-main").textContent = t.showMain;
        document.getElementById("quit").textContent = t.quit;
        document.getElementById("open-browser").textContent = t.openBrowser;
        document.getElementById("loading-hint").textContent = t.loadingHint;
        applyWindowCopy(t);
      }

      function emitWindowAction(action) {
        const invoke = window._wails?.invoke;
        if (typeof invoke === "function") {
          invoke(`wails:event:emit:desktop:${action}`);
          return;
        }
        Events.Emit("desktop:" + action);
      }

      document.addEventListener("contextmenu", (event) => {
        event.preventDefault();
      });

      document.body.addEventListener("click", (event) => {
        const btn = event.target.closest("[data-action]");
        if (!btn) return;
        const action = btn.getAttribute("data-action");
        if (
          document.documentElement.dataset.mode === "settings" &&
          action === "close"
        ) {
          call("HideSettings");
          return;
        }
        emitWindowAction(action);
      });

      async function call(name, ...args) {
        return Call.ByName("main.App." + name, ...args);
      }

      function current() {
        return {
          locale: document.getElementById("locale").value,
          autostart: document.getElementById("autostart").checked,
          minimizeToTray: document.getElementById("tray").checked,
          preventSleep: document.getElementById("sleep").checked,
        };
      }

      function settingsStatusEl() {
        return document.getElementById("settings-status");
      }

      async function persist() {
        let savedBefore;
        const errEl = settingsStatusEl();
        try {
          savedBefore = await call("GetSettingsStatus");
          const saved = await call("SaveSettings", {
            ...savedBefore,
            ...current(),
          });
          document.getElementById("autostart").checked = !!saved.autostart;
          document.getElementById("sleep").checked = !!saved.preventSleep;
          errEl.classList.add("hidden");
          applyCopy(saved.locale);
        } catch (error) {
          if (savedBefore) {
            document.getElementById("autostart").checked =
              !!savedBefore.autostart;
            document.getElementById("sleep").checked =
              !!savedBefore.preventSleep;
          }
          errEl.textContent = String(error);
          errEl.classList.remove("hidden");
        }
      }

      const settingsMode =
        new URLSearchParams(window.location.search).get("settings") === "1";
      const s = await call("GetSettingsStatus");
      const locale = s.locale || "en";
      document.getElementById("status").textContent =
        (copy[locale] || copy.en).statusWait;
      applyCopy(locale);

      if (settingsMode) {
        document.getElementById("loading-panel").classList.add("hidden");
        document.getElementById("settings-panel").classList.remove("hidden");
        document.getElementById("locale").value = locale;
        document.getElementById("autostart").checked = !!s.autostart;
        document.getElementById("tray").checked = s.minimizeToTray !== false;
        document.getElementById("sleep").checked = !!s.preventSleep;

        for (const id of ["locale", "autostart", "tray", "sleep"]) {
          document.getElementById(id).addEventListener("change", persist);
        }
        document
          .getElementById("show-main")
          .addEventListener("click", () => call("ShowMain"));
        document
          .getElementById("quit")
          .addEventListener("click", () => call("Quit"));
      }

      document.getElementById("open-browser").addEventListener("click", () => {
        call("OpenServerInBrowser");
      });

      function eventText(ev) {
        if (typeof ev === "string") return ev;
        if (ev == null) return "";
        const raw = ev.data ?? ev.payload ?? ev;
        return String(raw ?? "").trim();
      }

      function applyDashboard(href) {
        const url = String(href || "").trim();
        if (!url) return false;
        const frame = document.getElementById("dashboard-frame");
        if (frame.getAttribute("src") !== url) {
          frame.src = url;
        }
        frame.classList.remove("hidden");
        document.getElementById("loading-panel").classList.add("hidden");
        return true;
      }

      function applyBootStatus(text, isError) {
        if (!text) return;
        document.getElementById("status").textContent = text;
        const stuck =
          !!isError ||
          /未就绪|did not become ready|无法连接|Could not connect/.test(text);
        document.getElementById("loading-panel").classList.toggle("is-error", stuck);
        if (stuck) {
          document.getElementById("open-browser").classList.remove("hidden");
        }
      }

      async function syncBoot() {
        try {
          const st = await call("GetBootState");
          applyBootStatus(st.status, !!st.error);
          applyDashboard(st.dashboardUrl);
        } catch (e) {
          /* splash keeps waiting */
        }
      }

      Events.On("desktop:dashboard", (ev) => {
        applyDashboard(eventText(ev));
      });
      Events.On("desktop:status", (ev) => {
        applyBootStatus(eventText(ev), false);
      });

      if (!settingsMode) {
        await call("SplashReady");
        await syncBoot();
        setInterval(syncBoot, 400);
      }
    </script>
  </body>
</html>
